<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Redact Beaver</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);

      color-scheme: light;
      --page-bg: #ffffff;
      --card-bg: #ffffff;
      --surface-bg: #f6f5f2;
      --pill-bg: #f4f2ee;
      --border-color: #ebe9e4;
      --text-color: #1c1c1e;
      --button-bg: #1c1c1e;
      --shadow-color: #1c1c1e;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --page-bg: #0e0e0f;
      --card-bg: #151516;
      --surface-bg: #202023;
      --pill-bg: #252528;
      --border-color: #303034;
      --text-color: #f3f3f4;
      --button-bg: #f3f3f4;
      --shadow-color: #000000;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--page-bg);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .beaver-art {
      filter: none;
    }

    html[data-theme="dark"] .beaver-art {
      filter: invert(1);
    }

    svg {
      height: min(96vh, 1040px);
      width: auto;
      max-width: 96vw;
      display: block;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center
    }

    svg {
      height: min(96vh, 1040px);
      width: auto;
      max-width: 96vw;
      display: block
    }

    .ui {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif
    }

    .mono {
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace
    }

    .fb {
      transform-box: fill-box;
      transform-origin: 50% 50%
    }

    .cover {
      transform-box: fill-box;
      transform-origin: 100% 50%
    }

    .bar {
      transform-box: fill-box;
      transform-origin: 0 50%
    }

    .hop {
      transform-box: fill-box;
      transform-origin: 50% 100%
    }

    .dL {
      --sx: 20px
    }

    .dR {
      --sx: -20px
    }

    .scene,
    .card,
    .pill,
    .hl,
    .bang,
    .drops,
    .anx,
    .btn,
    .cursor,
    .ripple,
    .bar,
    .chip,
    .chk,
    .chkring,
    .happy,
    .dash0,
    .dash1,
    .dash2,
    .dash3 {
      will-change: transform, opacity
    }

    .pill,
    .bang,
    .btn,
    .chk,
    .chkring,
    .ripple,
    .dash0,
    .dash1,
    .dash2,
    .dash3,
    .card {
      transform-box: fill-box;
      transform-origin: 50% 50%
    }

    .anx {
      transform-box: fill-box;
      transform-origin: 50% 100%
    }


    .eyeA,
    .browA,
    .dropA {
      transform-box: fill-box
    }

    .eyeA {
      transform-origin: 50% 50%;
      animation: look 3.6s ease-in-out infinite
    }

    .browA {
      transform-origin: 50% 50%;
      animation: worry 1.8s ease-in-out infinite
    }

    .browR {
      animation-delay: .3s
    }

    .dropA {
      transform-origin: 50% 0;
      animation: drip 2.4s ease-in infinite
    }

    .drop1 {
      animation-delay: .6s
    }

    .drop2 {
      animation-delay: 1.2s
    }

    .drop3 {
      animation-delay: 1.8s
    }

    @keyframes look {

      0%,
      18% {
        transform: translate(0, 0) scaleY(1)
      }

      24% {
        transform: translate(-5px, 1px) scaleY(1)
      }

      40% {
        transform: translate(-5px, 1px) scaleY(1)
      }

      46% {
        transform: translate(5px, -1px) scaleY(1)
      }

      62% {
        transform: translate(5px, -1px) scaleY(1)
      }

      68% {
        transform: translate(0, 0) scaleY(1)
      }

      80% {
        transform: translate(0, 0) scaleY(1)
      }

      83% {
        transform: translate(0, 2px) scaleY(.1)
      }

      87%,
      100% {
        transform: translate(0, 0) scaleY(1)
      }
    }

    @keyframes worry {

      0%,
      100% {
        transform: translateY(0) rotate(0)
      }

      50% {
        transform: translateY(-5px) rotate(-2deg)
      }
    }

    @keyframes drip {
      0% {
        opacity: 0;
        transform: translateY(-6px) scale(.8)
      }

      15% {
        opacity: 1;
        transform: translateY(0) scale(1)
      }

      70% {
        opacity: 1;
        transform: translateY(14px)
      }

      100% {
        opacity: 0;
        transform: translateY(26px)
      }
    }

    .eyeH {
      fill: none;
      stroke: var(--text-color);
      stroke-width: 14;
      stroke-linecap: round;
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: blink 3.2s ease-in-out infinite
    }

    .eye-art {
      filter: none;
    }

    html[data-theme="dark"] .eye-art {
      filter: invert(1);
    }

    .drop-art {
      filter: none;
    }

    html[data-theme="dark"] .drop-art {
      filter: invert(1);
    }

    @keyframes blink {

      0%,
      40%,
      100% {
        transform: scaleY(1)
      }

      46% {
        transform: scaleY(.25)
      }

      52% {
        transform: scaleY(1)
      }

      70% {
        transform: scaleY(1.12)
      }

      80% {
        transform: scaleY(1)
      }
    }

    .twk {
      animation: twk 2.8s ease-in-out infinite
    }

    .tw1 {
      animation-delay: .5s
    }

    .tw2 {
      animation-delay: 1.1s
    }

    .tw3 {
      animation-delay: 1.7s
    }

    @keyframes twk {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .55
      }
    }

    .ring {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: ringp 1.7s ease-out infinite
    }

    @keyframes ringp {
      0% {
        opacity: .55;
        transform: scale(1)
      }

      100% {
        opacity: 0;
        transform: scale(1.07, 1.28)
      }
    }

    .bangp {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: bp 1.2s ease-in-out infinite
    }

    @keyframes bp {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.14)
      }
    }

    .scene {
      animation: k_scene 16.0s linear infinite;
    }

    .card {
      animation: k_card 16.0s linear infinite;
    }

    .pill {
      animation: k_pill 16.0s linear infinite;
    }

    .cover {
      animation: k_cover 16.0s linear infinite;
    }

    .hl {
      animation: k_hl 16.0s linear infinite;
    }

    .keytxt {
      animation: k_keytxt 16.0s linear infinite;
    }

    .bang {
      animation: k_bang 16.0s linear infinite;
    }

    .drops {
      animation: k_drops 16.0s linear infinite;
    }

    .anx {
      animation: k_anx 16.0s linear infinite;
    }

    .btn {
      animation: k_btn 16.0s linear infinite;
    }

    .cursor {
      animation: k_cursor 16.0s linear infinite;
    }

    .ripple {
      animation: k_ripple 16.0s linear infinite;
    }

    .bar {
      animation: k_bar 16.0s linear infinite;
    }

    .chip {
      animation: k_chip 16.0s linear infinite;
    }

    .chk {
      animation: k_chk 16.0s linear infinite;
    }

    .chkring {
      animation: k_chkring 16.0s linear infinite;
    }

    .happy {
      animation: k_happy 16.0s linear infinite;
    }

    .hop {
      animation: k_hop 16.0s linear infinite;
    }

    .dash0 {
      animation: k_dash0 16.0s linear infinite;
    }

    .dash1 {
      animation: k_dash1 16.0s linear infinite;
    }

    .dash2 {
      animation: k_dash2 16.0s linear infinite;
    }

    .dash3 {
      animation: k_dash3 16.0s linear infinite;
    }

      0.0% {
        opacity: 0;
      }

      4.375% {
        opacity: 1;
      }

      93.125% {
        opacity: 1;
      }

      98.125% {
        opacity: 0;
      }

      100.0% {

      }

      }

        opacity: 1;
        transform: scale(1);
      }

      }

        transform: scaleX(0);
      }

      100.0% {
        transform: scaleX(0);
      }
    }

    @keyframes k_hl {
      0.0% {
        opacity: 0;
      }

      14.375% {
        opacity: 0;
        animation-timing-function: cubic-bezier(.22, 1, .36, 1);
      }

      17.5% {
        opacity: 1;
      }

      54.688% {
        opacity: 1;
      }

      54.75% {
        opacity: 0;
      }

      100.0% {
        opacity: 0;
      }
    }

    @keyframes k_keytxt {
      0.0% {
        opacity: 1;
      }

      54.688% {
        opacity: 1;
      }

      54.75% {
        opacity: 0;
      }

      100.0% {
        opacity: 0;
      }
    }

    @keyframes k_bang {

      }

        opacity: 1;
        transform: scale(1);
      }

      51.875% {
        opacity: 1;
        transform: scale(1);
        animation-timing-function: cubic-bezier(.5, 0, .8, .5);
      }

      54.375% {
        opacity: 0;
        transform: scale(0);
      }

      100.0% {
        opacity: 0;
        transform: scale(0);
      }
    }

    @keyframes k_drops {
      0.0% {
        opacity: 0;
      }

      16.25% {
        opacity: 0;
        animation-timing-function: cubic-bezier(.22, 1, .36, 1);
      }

      19.375% {
        opacity: 1;
      }

      51.875% {
        opacity: 1;
      }

      56.25% {
        opacity: 0;
      }

      100.0% {
        opacity: 0;
      }
    }

    @keyframes k_anx {
      0.0% {
        opacity: 0;
        transform: translateY(16px);
      }

      1.25% {
        opacity: 0;
        transform: translateY(16px);
        animation-timing-function: cubic-bezier(.22, 1, .36, 1);
      }

      6.875% {
        opacity: 1;
        transform: translateY(0);
      }

      56.875% {
        opacity: 1;
        transform: translateY(0);
        animation-timing-function: cubic-bezier(.65, 0, .35, 1);
      }

      59.375% {
        opacity: 0;
        transform: translateY(0);
      }

      100.0% {

        transform: translateY(0);
      }
    }

    @keyframes k_btn {
      0.0% {
        opacity: 0;
        transform: translateY(16px) scale(1);
      }

      33.75% {
        opacity: 0;
        transform: translateY(16px) scale(1);
        animation-timing-function: cubic-bezier(.22, 1, .36, 1);
      }

      38.125% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      50.0% {
        opacity: 1;
        transform: translateY(0) scale(1);
        animation-timing-function: cubic-bezier(.22, 1, .36, 1);
      }

      50.625% {
        opacity: 1;
        transform: translateY(0) scale(.95);
        animation-timing-function: cubic-bezier(.65, 0, .35, 1);
      }

      52.5% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      56.25% {
        opacity: 1;
        transform: translateY(0) scale(1);
        animation-timing-function: cubic-bezier(.65, 0, .35, 1);
      }

      59.375% {
        opacity: 0;

      }

      100.0% {
        opacity: 0;

      }
    }

    @keyframes k_cursor {
      0.0% {
        opacity: 0;

      }

      36.25% {
        opacity: 0;

      }

      38.75% {

        animation-timing-function: cubic-bezier(.45, 0, .2, 1);
      }

      48.125% {
        opacity: 1;
        transform: translate(806px, 378px) scale(1);
      }

      50.0% {
        opacity: 1;
        transform: translate(806px, 378px) scale(1);
        animation-timing-function: cubic-bezier(.22, 1, .36, 1);
      }

      50.625% {
        opacity: 1;
        transform: translate(806px, 378px) scale(.82);
        animation-timing-function: cubic-bezier(.65, 0, .35, 1);
      }

      52.375% {
        opacity: 1;
        transform: translate(806px, 378px) scale(1);
      }

      56.25% {
        opacity: 1;
        transform: translate(806px, 378px) scale(1);
        animation-timing-function: cubic-bezier(.65, 0, .35, 1);
      }

      60.0% {
        opacity: 0;
        transform: translate(840px, 408px) scale(1);
      }

      100.0% {
        opacity: 0;
        transform: translate(840px, 408px) scale(1);
      }
    }

    @keyframes k_ripple {
      0.0% {
        opacity: 0;
        transform: scale(.2);
      }

      50.5% {
        opacity: 0;
        transform: scale(.2);
        animation-timing-function: cubic-bezier(.22, 1, .36, 1);
      }

      50.625% {
        opacity: .38;

      }

      55.312% {

        transform: scale(1.5);
      }

      100.0% {
        opacity: 0;
        transform: scale(1.5);
      }

    @keyframes k_bar {
      0.0% {
        opacity: 0;
        transform: translateX(0) scaleX(0);
      }

      51.25% {
        opacity: 0;
        transform: translateX(0) scaleX(0);
      }

      51.313% {
        opacity: 1;
        transform: translateX(0) scaleX(0);
        animation-timing-function: cubic-bezier(.7, 0, .3, 1);
      }

      54.688% {
        opacity: 1;
        transform: translateX(0) scaleX(1);
      }

      55.625% {
        opacity: 1;
        transform: translateX(0) scaleX(1);
        animation-timing-function: cubic-bezier(.7, 0, .3, 1);
      }

      59.375% {
        opacity: 1;
        transform: translateX(508px) scaleX(1);
      }

      59.438% {
        opacity: 0;
        transform: translateX(508px) scaleX(1);
      }

      100.0% {
        opacity: 0;
        transform: translateX(508px) scaleX(1);
      }
    }

    @keyframes k_chip {
      0.0% {
        opacity: 0;
      }

      54.688% {
        opacity: 0;
      }

      54.75% {
        opacity: 1;
      }

      100.0% {
        opacity: 1;
      }
    }

        transform: scale(0);

        transform: scale(2.4);
      }

      100.0% {
        opacity: 0;
        transform: scale(2.4);
      }

      }

      57.5% {
        opacity: 0;
        animation-timing-function: cubic-bezier(.65, 0, .35, 1);
      }

      60.0% {
        opacity: 1;
      }

      100.0% {
        opacity: 1;
      }

      0.0% {
        transform: none;
      }

      57.812% {
        transform: none;
        animation-timing-function: cubic-bezier(.2, .7, .3, 1);

        animation-timing-function: cubic-bezier(.5, 0, .8, .5);

      * {
        animation: none !important
      }

      .scene {
        opacity: 1
      }

      .card {
        opacity: 1;
        transform: none
      }

      .pill,
      .bang,
      .drops,
      .anx,
      .btn,
      .cursor,
      .ripple,
      .bar,
      .hl,

<body>
  <svg viewBox="0 0 900 1250" xmlns="http://www.w3.org/2000/svg" role="img"
    aria-label="An anxious beaver notices an API key pasted from the clipboard, clicks Redact, the key becomes API-KEY, and the beaver turns happy.">
    <title>Redact your API key</title>
    <defs>
      <filter id="sh" x="-10%" y="-12%" width="120%" height="150%">
        <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="var(--text-color)" flood-opacity=".08" />
      </filter>
      <clipPath id="kclip">
        <rect x="254" y="186" width="508" height="52" rx="12" />
      </clipPath>
    </defs>
    <g class="scene">

      <!-- ===== prompt card ===== -->

  <script>
    function applyTheme(theme) {
      if (theme !== "light" && theme !== "dark") return;
      document.documentElement.dataset.theme = theme;
    }

    // Apply the saved theme when the animation first loads.
    try {
      applyTheme(localStorage.getItem("pp-theme") || "light");
    } catch {
      applyTheme("light");
    }

    // Update when the parent page's theme changes.
    window.addEventListener("message", (event) => {
      if (event.origin !== window.location.origin) return;
      if (event.data?.type !== "pp-theme-change") return;

      applyTheme(event.data.theme);
    });
  </script>
