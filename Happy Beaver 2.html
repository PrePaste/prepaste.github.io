<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Happy Beaver</title>
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: #fff
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center
        }

        svg {
            width: min(92vw, 560px);
            height: auto;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent
        }

        #beaver {
            transform-box: fill-box;
            transform-origin: 50% 100%
        }

        .tap {
            animation: tap .5s ease-out
        }

        .blink {
            opacity: 0;
            animation: blink 4s ease-in-out infinite
        }

        .blink .pupil {
            transform-box: fill-box;
            transform-origin: 50% 50%;
            animation: squish 4s ease-in-out infinite
        }

        @keyframes blink {

            0%,
            88% {
                opacity: 0
            }

            88.5%,
            97% {
                opacity: 1
            }

            97.5%,
            100% {
                opacity: 0
            }
        }

        @keyframes squish {

            0%,
            88% {
                transform: scaleY(1)
            }

            92.5% {
                transform: scaleY(.08)
            }

            97%,
            100% {
                transform: scaleY(1)
            }
        }

        @keyframes tap {
            0% {
                transform: none
            }

            35% {
                transform: scale(1.03, .96)
            }

            65% {
                transform: scale(.99, 1.02) translateY(-10px)
            }

            100% {
                transform: none
            }
        }

        @media (prefers-reduced-motion:reduce) {

            .blink,
            .pupil {
                animation: none
            }
        }
    </style>
</head>
